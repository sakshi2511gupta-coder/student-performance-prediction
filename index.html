<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎓 Student Performance Predictor</h1>
            <p>Analyze student performance using academic information</p>
        </header>

        <div class="card">

            <h2>Enter Student Details</h2>

            <form id="predictionForm">

                <div class="input-group">
                    <label for="studyHours">📚 Study Hours per Day</label>
                    <input type="number" id="studyHours"
                           placeholder="Example: 5"
                           min="0" max="24" step="0.1" required>
                </div>

                <div class="input-group">
                    <label for="attendance">📅 Attendance (%)</label>
                    <input type="number" id="attendance"
                           placeholder="Example: 85"
                           min="0" max="100" required>
                </div>

                <div class="input-group">
                    <label for="previousMarks">📊 Previous Marks (%)</label>
                    <input type="number" id="previousMarks"
                           placeholder="Example: 75"
                           min="0" max="100" required>
                </div>

                <div class="input-group">
                    <label for="assignmentScore">📝 Assignment Score (%)</label>
                    <input type="number" id="assignmentScore"
                           placeholder="Example: 80"
                           min="0" max="100" required>
                </div>

                <button type="submit">Predict Performance</button>

            </form>

            <div id="result" class="result hidden">

                <h2>Prediction Result</h2>

                <div class="score">
                    <span id="predictionScore">0%</span>
                </div>

                <h3 id="performanceLevel">Performance</h3>

                <p id="message"></p>

            </div>

        </div>

        <div class="chart-card">

            <h2>📊 Performance Analysis</h2>

            <div class="chart">

                <div class="bar-container">
                    <span>Study Hours</span>
                    <div class="bar">
                        <div id="studyBar"></div>
                    </div>
                </div>

                <div class="bar-container">
                    <span>Attendance</span>
                    <div class="bar">
                        <div id="attendanceBar"></div>
                    </div>
                </div>

                <div class="bar-container">
                    <span>Previous Marks</span>
                    <div class="bar">
                        <div id="marksBar"></div>
                    </div>
                </div>

                <div class="bar-container">
                    <span>Assignment</span>
                    <div class="bar">
                        <div id="assignmentBar"></div>
                    </div>
                </div>

            </div>

        </div>

        <footer>
            <p>Student Performance Prediction Project</p>
            <p>Created using HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
